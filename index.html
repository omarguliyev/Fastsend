<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Binary QR Transfer (Fast)</title>
<style>
  body{font-family:Arial,sans-serif;margin:20px;background:#f4f4f4;}
  .container{max-width:800px;margin:auto;background:white;padding:20px;border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);}
  h1{text-align:center;color:#333;}
  .mode-buttons{display:flex;justify-content:center;gap:20px;margin-bottom:20px;}
  button{padding:10px20px;font-size:16px;cursor:pointer;border:none;border-radius:4px;}
  .sender-btn{background:#4CAF50;color:white;}
  .receiver-btn{background:#2196F3;color:white;}
  .active{background:#555!important;}
  #senderUI,#receiverUI{display:none;}
  #senderUI.active,#receiverUI.active{display:block;}
  canvas{border:2px solid #ccc;margin-top:10px;background:#000;display:block;margin-left:auto;margin-right:auto;}
  video{width:100%;max-width:420px;display:block;margin:10px auto;background:#000;}
  input[type=file],input[type=range]{display:block;margin:10px auto;}
  #status{text-align:center;margin-top:10px;font-weight:bold;}
  #downloadLink{display:block;width:fit-content;margin:20px auto;padding:10px20px;
                background:#4CAF50;color:white;text-decoration:none;border-radius:4px;}
  .progress{width:100%;background:#eee;border-radius:4px;overflow:hidden;height:20px;margin:10px 0;}
  .progress div{height:100%;background:#4CAF50;width:0%;transition:width .2s;}
  .camera-toggle{margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="container">
  <h1>Binary QR Transfer (Fast)</h1>
  <div class="mode-buttons">
    <button id="senderBtn" class="sender-btn active">Sender</button>
    <button id="receiverBtn" class="receiver-btn">Receiver</button>
  </div>

  <!-- ---------- SENDER ---------- -->
  <div id="senderUI" class="ui active">
    <h2>Sender Mode</h2>
    <input type="file" id="fileInput">
    <label for="speedSlider">Speed (frames per second):</label>
    <input type="range" id="speedSlider" min="5" max="30" value="15">
    <span id="speedValue">15</span> FPS
    <button id="startSendBtn">Start Transfer</button>
    <div id="sendStatus"></div>
    <canvas id="sendCanvas" width="260" height="260"></canvas>
    <div id="sendProgress" class="progress"><div></div></div>
  </div>

  <!-- ---------- RECEIVER ---------- -->
  <div id="receiverUI" class="ui">
    <h2>Receiver Mode</h2>
    <video id="receiverVideo" autoplay playsinline></video>
    <div class="camera-toggle">
      <button id="toggleCamBtn">Switch Camera</button>
    </div>
    <canvas id="receiverCanvas" width="260" height="260" style="display:none;"></canvas>
    <button id="startReceiveBtn">Start Scanning</button>
    <div id="receiveStatus"></div>
    <div id="receiveProgress" class="progress"><div></div></div>
    <a id="downloadLink" href="#" download>Download Received File</a>
  </div>
</div>

<!-- Load QR and JSQR libraries from CDN -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
/* ==== UI ELEMENTS ==== */
const senderBtn = document.getElementById('senderBtn');
const receiverBtn = document.getElementById('receiverBtn');
const senderUI = document.getElementById('senderUI');
const receiverUI = document.getElementById('receiverUI');
const fileInput = document.getElementById('fileInput');
const speedSlider = document.getElementById('speedSlider');
const speedValue = document.getElementById('speedValue');
const startSendBtn = document.getElementById('startSendBtn');
const sendCanvas = document.getElementById('sendCanvas');
const sendCtx = sendCanvas.getContext('2d');
const sendStatus = document.getElementById('sendStatus');
const sendProgressBar = document.querySelector('#senderUI .progress div');
const receiverVideo = document.getElementById('receiverVideo');
const receiverCanvas = document.getElementById('receiverCanvas');
const receiverCtx = receiverCanvas.getContext('2d');
const startReceiveBtn = document.getElementById('startReceiveBtn');
const receiveStatus = document.getElementById('receiveStatus');
const receiveProgressBar = document.querySelector('#receiverUI .progress div');
const downloadLink = document.getElementById('downloadLink');
const toggleCamBtn = document.getElementById('toggleCamBtn');

/* ==== MODE SWITCHING ==== */
senderBtn.addEventListener('click', () => {
  senderBtn.classList.add('active'); receiverBtn.classList.remove('active');
  senderUI.classList.add('active'); receiverUI.classList.remove('active');
  stopSender(); stopReceiver();
});
receiverBtn.addEventListener('click', () => {
  receiverBtn.classList.add('active'); senderBtn.classList.remove('active');
  receiverUI.classList.add('active'); senderUI.classList.remove('active');
  stopSender(); stopReceiver();
});

speedSlider.addEventListener('input', () => {
  speedValue.textContent = speedSlider.value;
});

/* ==== SENDER LOGIC ==== */
let senderInterval = null;
let totalChunks = 0;
let chunkIdx = 0;
const CHUNK_SIZE = 900; // bytes per QR (leaves room for overhead)
const FPS = parseInt(speedSlider.value);
const FRAME_DELAY = 1000 / FPS;

function startSender() {
  const file = fileInput.files[0];
  if (!file) {
    sendStatus.textContent = 'Please select a file';
    return;
  }
  stopSender(); // reset any previous state
  chunkIdx = 0;
  totalChunks = Math.ceil(file.size / CHUNK_SIZE);
  sendProgressBar.style.width = '0%';
  sendStatus.textContent = `Preparing ${totalChunks} chunks…`;
  // Kick off first chunk after short delay
  setTimeout(showNextChunk, 200);
}

function showNextChunk() {
  if (chunkIdx >= totalChunks) {
    sendStatus.textContent = 'Transfer complete!';
    clearInterval(senderInterval);
    senderInterval = null;
    return;
  }
  const file = fileInput.files[0];
  const start = chunkIdx * CHUNK_SIZE;
  const end = Math.min(start + CHUNK_SIZE, file.size);
  file.slice(start, end).arrayBuffer().then(buf => {
    // Encode chunk as base64 (URL-safe) and prefix with chunk index (4‑byte BE)
    const binary = new Uint8Array(buf);
    const header = new Uint8Array(4);
    header[0] = (chunkIdx >> 24) & 0xff;
    header[1] = (chunkIdx >> 16) & 0xff;
    header[2] = (chunkIdx >> 8) & 0xff;
    header[3] = chunkIdx & 0xff;
    const payload = new Uint8Array(header.length + binary.length);
    payload.set(header);
    payload.set(binary, header.length);
    // Convert to base64 string
    let b64 = btoa(String.fromCharCode(...payload));
    // Convert to URL‑safe base64 (replace +/ with -_, remove padding)
    b64 = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    // Draw QR code into canvas
    QRCode.toCanvas(sendCanvas, b64, { width: 260, margin: 1 }, err => {
      if (err) {
        sendStatus.textContent = 'QR generation error';
        console.error(err);
      } else {
        // Update progress
        chunkIdx++;
        const pct = Math.round((chunkIdx / totalChunks) * 100);
        sendProgressBar.style.width = pct + '%';
        sendStatus.textContent = `Sending chunk ${chunkIdx}/${totalChunks} (${pct}%)`;
      }
    });
  }).catch(err => {
    sendStatus.textContent = 'Error reading file';
    console.error(err);
  });
}

/* Handle FPS changes */
speedSlider.addEventListener('change', () => {
  // Restart interval with new speed if currently running
  if (senderInterval) {
    clearInterval(senderInterval);
    senderInterval = setInterval(showNextChunk, 1000 / parseInt(speedSlider.value));
  }
});

function startSenderLoop() {
  senderInterval = setInterval(showNextChunk, FRAME_DELAY);
}
startSendBtn.addEventListener('click', () => {
  startSender();
  senderInterval = setInterval(showNextChunk, FRAME_DELAY);
});

function stopSender() {
  if (senderInterval) {
    clearInterval(senderInterval);
    senderInterval = null;
  }
  sendCtx.clearRect(0,0,sendCanvas.width,sendCanvas.height);
  sendStatus.textContent = '';
  sendProgressBar.style.width = '0%';
}

/* ==== RECEIVER LOGIC ==== */
let receiverInterval = null;
let currentStream = null;
let currentFacing = 'environment'; // back camera by default
let receivedChunks = {}; // index => Uint8Array
let expectedTotal = null;
let isReceiving = false;

function startReceiver(facingMode) {
  stopReceiver(); // ensure clean start
  navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
    .then(stream => {
      currentStream = stream;
      receiverVideo.srcObject = stream;
      return receiverVideo.play();
    })
    .then(() => {
      receiveStatus.textContent = `Video started (${facingMode==='environment'?'back':'front'} camera). Point at sender QR codes.`;
      isReceiving = true;
      receiverInterval = setInterval(sampleVideoFrame, 80); // ~12 fps sampling
    })
    .catch(err => {
      receiveStatus.textContent = 'Camera error: ' + err.message;
    });
}

function sampleVideoFrame() {
  if (receiverVideo.readyState !== HTMLMediaElement.HAVE_ENOUGH_DATA) return;
  // Draw video frame to hidden canvas for sampling
  receiverCtx.drawImage(receiverVideo, 0, 0, receiverCanvas.width, receiverCanvas.height);
  const imageData = receiverCtx.getImageData(0, 0, receiverCanvas.width, receiverCanvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height, {
    inversionAttempts: 'dontInvert',
  });
  if (code && code.data) {
    // Decode the received base64 string (URL‑safe)
    let b64 = code.data;
    // Convert URL‑safe back to standard base64
    b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
    // Pad to multiple of 4
    while (b64.length % 4) b64 += '=';
    try {
      const decoded = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      // First 4 bytes = chunk index (big‑endian)
      if (decoded.length < 4) return;
      const idx = ((decoded[0] << 24) >>> 0) +
                  ((decoded[1] << 16) >>> 0) +
                  ((decoded[2] << 8)  >>> 0) +
                   decoded[3];
      const payload = decoded.slice(4);
      if (!receivedChunks[idx]) {
        receivedChunks[idx] = payload;
        // If we have a header chunk (idx===0) that tells total count, use it
        if (idx === 0 && expectedTotal === null && payload.length >= 4) {
          // Optional: first 4 bytes of payload could be total chunks
          const total = ((payload[0] << 24) >>> 0) +
                        ((payload[1] << 16) >>> 0) +
                        ((payload[2] << 8)  >>> 0) +
                         payload[3];
          if (!isNaN(total) && total > 0) expectedTotal = total;
        }
        updateProgress();
        // If we have all chunks, assemble and finish
        if (expectedTotal !== null && Object.keys(receivedChunks).length >= expectedTotal) {
          finishReceiver();
        }
      }
    } catch (e) {
      // Ignore malformed data
    }
  }
}

function updateProgress() {
  const received = Object.keys(receivedChunks).length;
  const total = expectedTotal || '?';
  const pct = expectedTotal ? Math.round((received / expectedTotal) * 100) : 0;
  receiveProgressBar.style.width = pct + '%';
  receiveStatus.textContent = `Received ${received}/${total} chunks (${pct}%)`;
}

function finishReceiver() {
  stopReceiver();
  // Sort chunks by index and concatenate
  const sortedIdx = Object.keys(receivedChunks).map(Number).sort((a,b)=>a-b);
  const all = [];
  for (const i of sortedIdx) {
    all.push(receivedChunks[i]);
  }
  const blob = new Blob(all);
  const url = URL.createObjectURL(blob);
  downloadLink.href = url;
  downloadLink.style.display = 'inline-block';
  receiveStatus.textContent += ` | Transfer complete! ${all.reduce((s,a)=>s+a.byteLength,0)} bytes ready to download.`;
  isReceiving = false;
}

function stopReceiver() {
  if (receiverInterval) {
    clearInterval(receiverInterval);
    receiverInterval = null;
  }
  if (currentStream) {
    currentStream.getTracks().forEach(t=>t.stop());
    currentStream = null;
  }
  receiverVideo.srcObject = null;
  receiverCtx.clearRect(0,0,receiverCanvas.width,receiverCanvas.height);
  receivedChunks = {};
  expectedTotal = null;
  isReceiving = false;
  receiveProgressBar.style.width = '0%';
  downloadLink.href = '#';
  downloadLink.style.display = 'none';
  receiveStatus.textContent = '';
}

/* ==== BUTTON HANDLERS ==== */
startReceiveBtn.addEventListener('click', () => {
  if (!isReceiving) {
    startReceiver(currentFacing);
    startReceiveBtn.textContent = 'Stop Scanning';
    receiveStatus.textContent = '';
    receivedChunks = {};
    expectedTotal = null;
  } else {
    stopReceiver();
    startReceiveBtn.textContent = 'Start Scanning';
  }
});

toggleCamBtn.addEventListener('click', () => {
  // Toggle facing mode
  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  if (isReceiving) {
    // Restart with new camera immediately
    stopReceiver();
    startReceiver(currentFacing);
    receiveStatus.textContent = `Switching to ${currentFacing==='environment'?'back':'front'} camera…`;
  } else {
    receiveStatus.textContent = `Camera will switch to ${currentFacing==='environment'?'back':'front'} on start.`;
  }
});
</script>
</body>
</html>
