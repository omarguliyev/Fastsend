<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary QR Transfer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f4; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .mode-buttons { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; }
        .sender-btn { background: #4CAF50; color: white; }
        .receiver-btn { background: #2196F3; color: white; }
        .active { background: #555 !important; }
        #senderUI, #receiverUI { display: none; }
        #senderUI.active, #receiverUI.active { display: block; }
        canvas { border: 2px solid #ccc; margin-top: 10px; background: #000; display: block; margin-left: auto; margin-right: auto; }
        video { width: 100%; max-width: 400px; display: block; margin: 10px auto; background: #000; }
        input[type=file], input[type=range] { display: block; margin: 10px auto; }
        #status { text-align: center; margin-top: 10px; font-weight: bold; }
        #downloadLink { display: block; width: fit-content; margin: 20px auto; padding: 10px 20px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Binary QR Transfer</h1>
        <div class="mode-buttons">
            <button id="senderBtn" class="sender-btn active">Sender</button>
            <button id="receiverBtn" class="receiver-btn">Receiver</button>
        </div>
        <div id="senderUI" class="ui active">
            <h2>Sender Mode</h2>
            <input type="file" id="fileInput">
            <label for="speedSlider">Speed (bits per second):</label>
            <input type="range" id="speedSlider" min="1" max="100" value="30">
            <span id="speedValue">30</span> bits/s
            <button id="startSendBtn">Start Transfer</button>
            <canvas id="sendCanvas" width="400" height="400"></canvas>
            <div id="sendStatus"></div>
        </div>
        <div id="receiverUI" class="ui">
            <h2>Receiver Mode</h2>
            <video id="receiverVideo" autoplay playsinline></video>
            <canvas id="receiverCanvas" width="400" height="400" style="display:none;"></canvas>
            <button id="startReceiveBtn">Start Scanning</button>
            <div id="receiveStatus"></div>
            <a id="downloadLink" href="#" download>Download Received File</a>
        </div>
    </div>
<script>
    const senderBtn = document.getElementById('senderBtn');
    const receiverBtn = document.getElementById('receiverBtn');
    const senderUI = document.getElementById('senderUI');
    const receiverUI = document.getElementById('receiverUI');
    const fileInput = document.getElementById('fileInput');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const startSendBtn = document.getElementById('startSendBtn');
    const sendCanvas = document.getElementById('sendCanvas');
    const sendCtx = sendCanvas.getContext('2d');
    const sendStatus = document.getElementById('sendStatus');
    const receiverVideo = document.getElementById('receiverVideo');
    const receiverCanvas = document.getElementById('receiverCanvas');
    const receiverCtx = receiverCanvas.getContext('2d');
    const startReceiveBtn = document.getElementById('startReceiveBtn');
    const receiveStatus = document.getElementById('receiveStatus');
    const downloadLink = document.getElementById('downloadLink');

    // Mode switching
    senderBtn.addEventListener('click', () => {
        senderBtn.classList.add('active');
        receiverBtn.classList.remove('active');
        senderUI.classList.add('active');
        receiverUI.classList.remove('active');
        stopSender();
        stopReceiver();
    });
    receiverBtn.addEventListener('click', () => {
        receiverBtn.classList.add('active');
        senderBtn.classList.remove('active');
        receiverUI.classList.add('active');
        senderUI.classList.remove('active');
        stopSender();
        stopReceiver();
    });

    speedSlider.addEventListener('input', () => {
        speedValue.textContent = speedSlider.value;
    });

    // Sender logic
    let senderInterval = null;
    let senderBits = '';
    let senderPos = 0;
    const PIXEL_SIZE = 10; // size of each bit square in pixels

    function startSender() {
        const file = fileInput.files[0];
        if (!file) {
            sendStatus.textContent = 'Please select a file';
            return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
            const arrayBuffer = e.target.result;
            // Convert ArrayBuffer to binary string
            let binary = '';
            const bytes = new Uint8Array(arrayBuffer);
            for (let i = 0; i < bytes.length; i++) {
                binary += bytes[i].toString(2).padStart(8, '0');
            }
            senderBits = binary;
            senderPos = 0;
            sendStatus.textContent = `Prepared ${senderBits.length} bits. Starting...`;
            // Start animation
            const intervalMs = 1000 / parseInt(speedSlider.value);
            senderInterval = setInterval(drawSenderFrame, intervalMs);
        };
        reader.onerror = () => {
            sendStatus.textContent = 'Error reading file';
        };
        reader.readAsArrayBuffer(file);
    }

    function drawSenderFrame() {
        // Clear canvas
        sendCtx.fillStyle = '#000';
        sendCtx.fillRect(0, 0, sendCanvas.width, sendCanvas.height);

        // Determine how many bits we can display
        const cols = Math.floor(sendCanvas.width / PIXEL_SIZE);
        const rows = Math.floor(sendCanvas.height / PIXEL_SIZE);
        const capacity = cols * rows;

        // Draw bits from current position
        for (let i = 0; i < capacity; i++) {
            const bitIndex = (senderPos + i) % senderBits.length;
            const bit = senderBits[bitIndex];
            const col = i % cols;
            const row = Math.floor(i / cols);
            const x = col * PIXEL_SIZE;
            const y = row * PIXEL_SIZE;
            sendCtx.fillStyle = bit === '1' ? '#fff' : '#000';
            sendCtx.fillRect(x, y, PIXEL_SIZE, PIXEL_SIZE);
        }

        senderPos = (senderPos + capacity) % senderBits.length;
        if (senderPos === 0) {
            // Completed one full cycle
            sendStatus.textContent = `Transmitting... (looping)`;
        }
    }

    function stopSender() {
        if (senderInterval) {
            clearInterval(senderInterval);
            senderInterval = null;
        }
        sendCtx.clearRect(0, 0, sendCanvas.width, sendCanvas.height);
        sendStatus.textContent = '';
    }

    startSendBtn.addEventListener('click', startSender);

    // Receiver logic
    let receiverInterval = null;
    let receivedBits = '';
    const THRESHOLD = 128; // brightness threshold for black/white

    async function startReceiver() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            receiverVideo.srcObject = stream;
            receiverVideo.play();
            receiveStatus.textContent = 'Video started. Point camera at sender screen.';
            // Start sampling
            receiverInterval = setInterval(sampleVideoFrame, 100); // sample every 100ms
        } catch (err) {
            receiveStatus.textContent = 'Error accessing camera: ' + err.message;
        }
    }

    function sampleVideoFrame() {
        if (receiverVideo.readyState !== navigator.mediaDevices.HAVE_ENOUGH_DATA) {
            return;
        }
        // Draw video frame to canvas for sampling
        receiverCtx.drawImage(receiverVideo, 0, 0, receiverCanvas.width, receiverCanvas.height);
        const imageData = receiverCtx.getImageData(0, 0, receiverCanvas.width, receiverCanvas.height);
        const data = imageData.data;
        // Compute average brightness of center region
        const centerSize = Math.min(receiverCanvas.width, receiverCanvas.height) * 0.2; // 20% of size
        const offsetX = (receiverCanvas.width - centerSize) / 2;
        const offsetY = (receiverCanvas.height - centerSize) / 2;
        let sum = 0;
        let count = 0;
        for (let y = offsetY; y < offsetY + centerSize; y++) {
            for (let x = offsetX; x < offsetX + centerSize; x++) {
                const i = (Math.floor(y) * receiverCanvas.width + Math.floor(x)) * 4;
                const r = data[i];
                const g = data[i+1];
                const b = data[i+2];
                // luminance approximation
                sum += 0.2126 * r + 0.7152 * g + 0.0722 * b;
                count++;
            }
        }
        const avg = sum / count;
        const bit = avg > THRESHOLD ? '1' : '0';
        receivedBits += bit;
        // Update status periodically
        if (receivedBits.length % 100 === 0) {
            receiveStatus.textContent = `Received ${receivedBits.length} bits...`;
        }
        // Attempt to decode when we have enough bits (simple heuristic: stop after 5 seconds of no change? we'll just wait for stop button)
    }

    function stopReceiver() {
        if (receiverInterval) {
            clearInterval(receiverInterval);
            receiverInterval = null;
        }
        if (receiverVideo.srcObject) {
            const stream = receiverVideo.srcObject;
            const tracks = stream.getTracks();
            tracks.forEach(track => track.stop());
            receiverVideo.srcObject = null;
        }
        receiverCtx.clearRect(0, 0, receiverCanvas.width, receiverCanvas.height);
        // Convert received bits to file
        if (receivedBits.length >= 8) {
            // Pad to multiple of 8
            const paddedLength = Math.floor(receivedBits.length / 8) * 8;
            const trimmed = receivedBits.substring(0, paddedLength);
            const bytes = new Uint8Array(trimmed.length / 8);
            for (let i = 0; i < trimmed.length; i += 8) {
                const byteString = trimmed.substring(i, i + 8);
                bytes[i / 8] = parseInt(byteString, 2);
            }
            const blob = new Blob([bytes]);
            const url = URL.createObjectURL(blob);
            downloadLink.href = url;
            downloadLink.style.display = 'inline-block';
            receiveStatus.textContent += ` | Received ${bytes.length} bytes. Ready to download.`;
        } else {
            receiveStatus.textContent += ' Not enough data received.';
        }
    }

    startReceiveBtn.addEventListener('click', () => {
        if (!receiverInterval) {
            startReceiver();
            startReceiveBtn.textContent = 'Stop Scanning';
            receiveStatus.textContent = '';
            receivedBits = '';
            downloadLink.href = '#';
            downloadLink.style.display = 'none';
        } else {
            stopReceiver();
            startReceiveBtn.textContent = 'Start Scanning';
        }
    });
</script>
</body>
</html>
